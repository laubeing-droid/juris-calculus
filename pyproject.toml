[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "juris-calculus"
dynamic = ["version"]
description = "Auditable formal legal reasoning kernel"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [
  { name = "laubeing-droid" },
]
dependencies = [
  "PyYAML>=6.0",
  "cryptography==50.0.0",
]

[project.scripts]
jc = "compiler_core.cli:main"

[tool.setuptools.dynamic]
version = { attr = "compiler_core.version.__version__" }

[tool.setuptools]
packages = ["compiler_core", "compiler_core.backends", "configs", "schemas"]
py-modules = ["mcp_server"]
include-package-data = false

[tool.setuptools.package-data]
configs = ["render_profiles/neutral.yaml"]
schemas = ["*.json"]
