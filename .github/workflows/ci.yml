name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  required:
    name: required / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/test.lock

      - name: Install hash-locked test graph
        run: python -m pip install --require-hashes -r requirements/test.lock

      - name: Required current suites and explicit future RED
        run: python -B tools/remediate_v4.py verify-wave W0-04

      - name: Ubuntu storage and chaos subset
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python -B -m pytest -c tests/pytest.ini -q -p no:cacheprovider tests/storage_chaos

      - name: Windows DACL and reparse subset
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: python -B -m pytest -c tests/pytest.ini -q -p no:cacheprovider tests/windows_security

  static:
    name: generated / authority / lint / type / unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/release.lock
            requirements/test.lock

      - name: Install hash-locked release and test graphs
        run: |
          python -m pip install --require-hashes -r requirements/release.lock
          python -m pip install --require-hashes -r requirements/test.lock
          python -m pip check

      - name: Generated publications are current
        run: |
          python -B tools/build_file_disposition.py
          git diff --exit-code -- remediation/v4/file-disposition.json
          python -B tools/remediate_v4.py verify-wave W1-03

      - name: Current authority and docs
        run: |
          python -B tools/remediate_v4.py verify-wave W5-05
          python -B -m pytest -c tests/pytest.ini -q -p no:cacheprovider tests/packaging/test_current_authority_docs.py

      - name: Purity and committed-secret policy
        run: >-
          python -B -m pytest -c tests/pytest.ini -q -p no:cacheprovider
          tests/packaging/test_legacy_cn_corpus_absent.py
          tests/mcp_protocol/test_mcp_legacy_cn_corpus_absent.py
          tests/packaging/test_ci_matrix.py::test_committed_private_key_is_test_only_and_unique

      - name: Ruff fatal-error gate on current paths
        run: >-
          python -m ruff check --no-cache --select E9,F63,F7,F82
          compiler_core mcp_server.py tools tests/contract tests/differential
          tests/formal_e2e tests/integration tests/mcp_protocol tests/packaging
          tests/property tests/security tests/semantic_mutation tests/storage_chaos
          tests/windows_security

      - name: Mypy release and CI surfaces
        run: >-
          python -m mypy --no-incremental --follow-imports=skip --ignore-missing-imports
          compiler_core/version.py tools/build_provenance.py
          tests/packaging/test_ci_matrix.py tests/differential/test_self_contained_v4.py
          tests/differential/test_pinned_companion_spec.py
          tests/formal_e2e/test_installed_production.py

      - name: Current unit gates
        run: >-
          python -B -m pytest -c tests/pytest.ini -q -p no:cacheprovider
          tests/unit/test_remediation_runner.py tests/unit/test_supply_chain_gate.py

      - name: Lock hash license and vulnerability audit
        run: python -B tools/supply_chain_gate.py --all-profiles --output reports/supply-chain.json

  package:
    name: A-B build / installed wheel / release evidence
    needs: [required, static]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/build.lock
            requirements/release.lock

      - name: Install hash-locked build and release graphs
        run: |
          python -m pip install --require-hashes -r requirements/build.lock
          python -m pip install --require-hashes -r requirements/release.lock

      - name: Two clean source archives and byte-identical wheels
        shell: bash
        run: |
          mkdir -p work/source-a work/source-b work/dist-a work/dist-b reports
          git archive --format=tar HEAD | tar -xf - -C work/source-a
          git archive --format=tar HEAD | tar -xf - -C work/source-b
          epoch="$(git show -s --format=%ct HEAD)"
          python -B tools/wheel_gate.py --source work/source-a --out-dir work/dist-a --source-date-epoch "$epoch" --no-isolation --output reports/wheel-a.json
          python -B tools/wheel_gate.py --source work/source-b --out-dir work/dist-b --source-date-epoch "$epoch" --no-isolation --output reports/wheel-b.json
          cmp work/dist-a/*.whl work/dist-b/*.whl

      - name: Repository-outside installed production suites
        shell: bash
        run: |
          mkdir -p work/wheelhouse work/installed
          python -m pip download --require-hashes --dest work/wheelhouse -r requirements/core.lock -r requirements/test.lock
          wheel="$(find work/dist-a -name '*.whl' -print -quit)"
          python -B tools/wheel_gate.py --source work/source-a --installed-wheel "$wheel" --test-lock work/source-a/requirements/test.lock --wheelhouse work/wheelhouse --work-dir work/installed --output reports/installed-wheel.json

      - name: CycloneDX SBOM
        run: python -m pip_audit --requirement requirements/core.lock --format cyclonedx-json --output reports/sbom-core.cdx.json --progress-spinner off --strict --disable-pip

      - name: Build provenance
        shell: bash
        run: |
          wheel="$(find work/dist-a -name '*.whl' -print -quit)"
          rebuild="$(find work/dist-b -name '*.whl' -print -quit)"
          version="$(python -c 'from compiler_core.version import __version__; print(__version__)')"
          python -B tools/build_provenance.py create --wheel "$wheel" --rebuild-wheel "$rebuild" --source-commit "$GITHUB_SHA" --tag "v$version" --key tests/fixtures/keys/v4-test-ed25519.json --sbom-output reports/release-sbom.json --output reports/build-provenance.json --checksums-output reports/SHA256SUMS --release-candidate
          python -B tools/build_provenance.py verify --wheel "$wheel" --sbom reports/release-sbom.json --provenance reports/build-provenance.json --checksums reports/SHA256SUMS --key tests/fixtures/keys/v4-test-ed25519.json --allow-test-key

      - name: Performance gate
        run: python -B -m pytest -c tests/pytest.ini -q -p no:cacheprovider tests/security/test_resource_limits.py

      - name: Current documentation paths
        run: python -B -m pytest -c tests/pytest.ini -q -p no:cacheprovider tests/packaging/test_current_authority_docs.py

      - name: Upload exact release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            work/dist-a/*.whl
            work/dist-b/*.whl
            reports/

  promote:
    name: Promote exact attested tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    permissions:
      contents: write
    uses: ./.github/workflows/auto-release.yml
    with:
      artifact-name: release-candidate-${{ github.sha }}
    secrets: inherit
