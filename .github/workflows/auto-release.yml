name: Promote attested V4 artifact

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Exact artifact produced by this caller run
        required: true
        type: string
    secrets:
      JC_RELEASE_ED25519_KEY_JSON:
        description: Production Ed25519 release-attestor key document
        required: true

permissions:
  contents: read

jobs:
  promote:
    name: Promote exact tested wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/release.lock

      - name: Install hash-locked release graph
        run: python -m pip install --require-hashes -r requirements/release.lock

      - name: Download exact caller artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/release-candidate

      - name: Verify tag, source, and byte-identical build pair
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          version="$(python -c 'import runpy; print(runpy.run_path("compiler_core/version.py")["__version__"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          test "$(find "$RUNNER_TEMP/release-candidate/work/dist-a" -name '*.whl' -type f | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/release-candidate/work/dist-b" -name '*.whl' -type f | wc -l)" -eq 1
          wheel_a="$(find "$RUNNER_TEMP/release-candidate/work/dist-a" -name '*.whl' -type f -print -quit)"
          wheel_b="$(find "$RUNNER_TEMP/release-candidate/work/dist-b" -name '*.whl' -type f -print -quit)"
          cmp "$wheel_a" "$wheel_b"

      - name: Sign and verify exact wheel for production promotion
        shell: bash
        env:
          RELEASE_KEY_JSON: ${{ secrets.JC_RELEASE_ED25519_KEY_JSON }}
        run: |
          umask 077
          key="$RUNNER_TEMP/jc-release-key.json"
          evidence="$RUNNER_TEMP/release-evidence"
          trap 'rm -f "$RUNNER_TEMP/jc-release-key.json"' EXIT
          printf '%s' "$RELEASE_KEY_JSON" > "$key"
          mkdir -p "$evidence"
          wheel_a="$(find "$RUNNER_TEMP/release-candidate/work/dist-a" -name '*.whl' -type f -print -quit)"
          wheel_b="$(find "$RUNNER_TEMP/release-candidate/work/dist-b" -name '*.whl' -type f -print -quit)"
          python -B tools/build_provenance.py create --wheel "$wheel_a" --rebuild-wheel "$wheel_b" --source-commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --key "$key" --sbom-output "$evidence/release-sbom.json" --output "$evidence/build-provenance.json" --checksums-output "$evidence/SHA256SUMS"
          python -B tools/build_provenance.py verify --wheel "$wheel_a" --sbom "$evidence/release-sbom.json" --provenance "$evidence/build-provenance.json" --checksums "$evidence/SHA256SUMS" --key "$key" --require-tag-ref

      - name: Promote without rebuilding
        shell: bash
        run: |
          wheel_a="$(find "$RUNNER_TEMP/release-candidate/work/dist-a" -name '*.whl' -type f -print -quit)"
          evidence="$RUNNER_TEMP/release-evidence"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "juris-calculus $GITHUB_REF_NAME" --generate-notes "$wheel_a" "$evidence/SHA256SUMS" "$evidence/release-sbom.json" "$evidence/build-provenance.json"
