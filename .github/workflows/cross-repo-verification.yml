name: Cross-repo C06 verification

on:
  workflow_dispatch:
    inputs:
      lmm_repository:
        description: Legal Math Modeling repository with the pinned full-release subject
        required: true
        type: string
      lmm_ref:
        description: Exact 40-character legal-math-modeling subject SHA
        required: true
        type: string
      runtime_ref:
        description: Exact 40-character Juris Calculus producer SHA for bound receipts
        required: true
        type: string
  workflow_call:
    inputs:
      lmm_repository:
        description: Legal Math Modeling repository with the pinned full-release subject
        required: true
        type: string
      lmm_ref:
        description: Exact 40-character legal-math-modeling subject SHA
        required: true
        type: string
      runtime_ref:
        description: Exact 40-character Juris Calculus producer SHA for bound receipts
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  verify:
    name: Verify JC entries against the pinned LMM full-release subject
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact Juris Calculus source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Juris Calculus with pytest
        run: |
          python -m pip install pytest
          python -m pip install .

      - name: Checkout pinned legal-math-modeling subject
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ inputs.lmm_repository }}
          ref: ${{ inputs.lmm_ref }}
          path: legal-math-modeling

      - name: Verify both checkout identities fail closed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legal-math-modeling rev-parse HEAD)" = "${{ inputs.lmm_ref }}"
          echo "${{ inputs.runtime_ref }}" | grep -E '^[0-9a-f]{40}$'
          sha256sum legal-math-modeling/proofs/lean/juris_lean/lean-toolchain \
            legal-math-modeling/proofs/lean/juris_lean/lake-manifest.json

      - name: Run cross-repo C06 verification and produce integration evidence
        run: >-
          python -B tools/verify_c06_integration.py
          --lmm-root legal-math-modeling
          --output work/jc-integration/integration-evidence.json
          --runtime-commit "${{ github.sha }}"
          --runtime-build-id "github-actions:${{ github.run_id }}:${{ github.run_attempt }}"

      - name: Assert the evidence claims only what the checker accepted
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(
              Path("work/jc-integration/integration-evidence.json").read_text(encoding="utf-8")
          )
          assert evidence["verification"]["all_passed"] is True
          assert evidence["verification"]["changed_module_mode_used"] is False
          assert evidence["legal_math_modeling"]["commit"] == "${{ inputs.lmm_ref }}"
          assert evidence["juris_calculus"]["commit"] == "${{ github.sha }}"
          assert evidence["legal_math_modeling"]["mandatory_registrations"] == 217
          boundaries = evidence["boundaries"]["not_established"]
          assert "E01_real_data_validation" in boundaries
          assert "truth_of_external_facts" in boundaries
          print("integration evidence accepted with boundaries kept open")
          PY

      - name: Upload integration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c06-integration-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/jc-integration/integration-evidence.json
            work/jc-integration/receipts/*.actual.json
            work/jc-integration/checker-reports/*.report.json
          retention-days: 90
