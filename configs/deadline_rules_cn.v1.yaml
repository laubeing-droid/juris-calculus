        - field: legalContext.statutoryMaxPenalty
          equals: below_five_years
        set:
          durationDays: 5
          durationUnit: years
      - when:
        - field: legalContext.statutoryMaxPenalty
          equals: five_to_below_ten_years
        set:
          durationDays: 10
          durationUnit: years
      - when:
        - field: legalContext.statutoryMaxPenalty
          equals: ten_years_or_above
        set:
          durationDays: 15
          durationUnit: years
      - when:
        - field: legalContext.statutoryMaxPenalty
          equals: life_or_death
        set:
          durationDays: 20
          durationUnit: years
