      officialUrl: http://yongning.gov.cn/zz/gonganynfj/fggz_8154/t4674515.html
      articles:
      - 87
      - 89
    legalContract:
      appliesTo: 刑法总则第四章第八节追诉期限的计算；不判定应否追诉的实体决定
      anchor: 犯罪之日（89条：连续或继续状态自行为终了之日起算，由调用方按已核事实选锚）
      preconditions:
      - 所涉罪名法定最高刑档位已核
      - 犯罪之日或行为终了之日已核
      - 不存在88条立案后逃避侦查审判、被害人控告应立案未立案等不受期限限制情形
      exceptions:
      - 87条第四档二十年：二十年后认为必须追诉的须报请最高人民检察院核准
      - 89条第二款追诉期限内又犯罪自犯后罪之日起算；本版未建调整分支，调整项一律具名拒绝
      - 追诉时效为实体法期间，届满日不因节假日顺延
      output: 追诉期限届满日候选；期限已过输出limitation_cap_review_required，不输出不再追诉的实体判定
      testIds:
      - RT22-PROSECUTION-TIERS
      - RT22-PROSECUTION-EXPIRED-REVIEW
